<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>Admin | Star Pets</title><meta name="robots" content="noindex"></head>
<body data-page="admin">
<header><a class="brand" href="/"><span class="mark"></span><span>Star <i>Pets</i> admin</span></a><button id="out" class="alt" hidden>Log out</button></header>
<main>
<section id="login" class="panel" style="max-width:380px;margin:3rem auto"><h1 style="margin-bottom:1rem">Admin login</h1>
<form id="lf"><label>Email<input name="email" type="email" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<p id="lerr" class="err" role="alert"></p><button>Log in</button></form></section>
<section id="dash" hidden>
<div class="two"><div class="panel wrap"><h2>Products</h2><table id="pt"></table></div>
<form id="pf" class="panel"><input type="hidden" name="pid"><h2 id="pfh">Add product</h2>
<label>Name<input name="name" required></label>
<label>Category<select name="category"><option>Dog</option><option>Cat</option><option>Accessories</option></select></label>
<label>Price (₹)<input name="price" type="number" min="0" step="1" required></label>
<label>Stock<input name="stock" type="number" min="0" step="1" required></label>
<label>Image URL (optional)<input name="image" placeholder="https://..."></label>
<label>Description<textarea name="description" rows="3"></textarea></label>
<button>Save product</button> <button type="button" class="alt" id="clr">Clear</button></form></div>
<div class="panel wrap" style="margin-top:1.5rem"><h2>Orders</h2><table id="ot"></table></div>
</section></main>
<script src="js/admin.js"></script></body></html>
